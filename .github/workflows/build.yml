name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '22'
      - name: Check source and catalog
        run: |
          python -m py_compile build.py install.py tools/refresh_catalog.py
          python tools/refresh_catalog.py --check
      - name: Build and verify APK
        run: python build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Cartoon-Watch-Android
          path: |
            outputs/Cartoon-Watch.apk
            outputs/Cartoon-Watch.apk.sha256
          if-no-files-found: error
          retention-days: 14
