<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d14">
  <title>Cartoon Watch</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3z"/><circle cx="11.5" cy="11.5" r="3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L20 5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m11 4-8 8 8 8M3 12h18"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3 10 14M10 4H4v16h16v-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a9 9 0 1 0 1 7M20 3v6h-6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <img class="brand-mark" src="brand.svg" alt="Cartoon Watch" width="49" height="42">
      <nav id="navigation">
        <button class="nav-button active" data-route="home" aria-label="Home"><svg><use href="#i-home"></use></svg><span>Home</span></button>
        <button class="nav-button" data-route="search" aria-label="Search"><svg><use href="#i-search"></use></svg><span>Search</span></button>
        <button class="nav-button" data-route="list" aria-label="My List"><svg><use href="#i-list"></use></svg><span>My List</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="connection-dot" title="Local watch history"></div><button class="nav-button" data-route="settings" aria-label="Settings"><svg><use href="#i-settings"></use></svg><span>Settings</span></button></div>
    </aside>
    <main id="main" tabindex="-1">
      <div id="content"></div>
      <footer class="footer"><span><kbd>↔ ↕</kbd> Browse <kbd>OK</kbd> Select <kbd>↩</kbd> Back</span><span id="footer-status">Made for the big screen</span></footer>
    </main>
  </div>
  <div id="detail" class="detail-layer" hidden aria-label="Show details"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="discovery.js"></script>
  <script src="app.js"></script>
</body>
</html>
